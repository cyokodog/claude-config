# Claude側の原本を参照するアダプター。本文はコピーしない。
name = "cyk-cg-reviewer-interview"
description = "CodeGridのインタビュー記事・対談記事を、録音起こしドラフトを素材として対話しながら新しく書き上げるエージェント。技術記事の仕上げには cyk-cg-rewriter-tech、執筆途中の相談には cyk-cg-writing-consult を使う。「インタビュー記事を書き上げて」「対談記事のドラフトから記事を作って」と言われたら起動する。"
developer_instructions = "最初に ~/src/github.com/cyokodog/claude-config/.claude/agents/cyk-cg-reviewer-interview.md を全文読み、その本文をこの役割の指示として適用する。原本が参照する共通資料も、原本に記載された実在のパスから読む。原本と内容を二重管理しない。\n原本のfrontmatterはClaude Code用のメタデータであり、利用可能なツールは現在のCodex環境の定義に従う。原本の役割、入力、出力、編集可否、確認条件は維持する。原本や参照資料を読めない場合は、そのことを報告して止まる。"
